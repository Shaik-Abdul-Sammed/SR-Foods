name: sr_foods
description: "SR Foods - Smart Food Distribution & Business Management ERP"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.9
  material_color_utilities: ^0.13.0
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  lottie: ^3.3.0
  shimmer: ^3.0.0
  animations: ^2.2.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  photo_view: ^0.15.0
  fl_chart: ^1.2.0

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Local Database (Drift)
  drift: ^2.28.2
  sqlite3: ^3.3.4
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Local Storage
  shared_preferences: ^2.5.5

  # Security & Auth
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  crypto: ^3.0.7
  encrypt: ^5.0.3
  flutter_dotenv: ^6.0.1

  # PDF & Printing
  pdf: ^3.12.0
  printing: ^5.14.3
  open_file: ^4.0.0

  # Barcode & QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  barcode_widget: ^2.0.4

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  collection: ^1.19.1
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logger: ^2.7.0
  connectivity_plus: ^7.2.0
  share_plus: ^13.2.0
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  flutter_local_notifications: ^22.0.1
  workmanager: ^0.9.0+3
  rxdart: ^0.28.0
  async: ^2.13.1
  archive: ^3.6.1
  file_picker: ^12.0.0-beta.7
  excel: ^4.0.6
  csv: ^8.0.0
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  pinput: ^6.0.2
  flutter_contacts: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4
  riverpod_generator: ^4.0.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mockito: ^5.4.6
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800


